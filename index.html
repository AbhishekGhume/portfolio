    <!-- Structured Data (JSON-LD).
         `alumniOf` is deliberately absent: the site publishes no education
         anywhere, and structured data that isn't on the page is the kind of
         claim Google treats as spam. Only facts stated in the visible content
         belong here. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Abhishek Ghume",
        "jobTitle": "Software Engineer",

        },

          "Java",
          "Spring Boot",
          "REST APIs",

    <meta property="og:image:alt" content="Abhishek — Fresher Software Engineer" />

    <!-- Twitter. These take `name`, not `property` — the two families come from
         different specs. Open Graph is RDFa, where the attribute is `property`;
         Twitter cards are plain HTML metadata, where it is `name`. Twitter's own
         crawler happens to accept either, but other consumers that read
         twitter:* tags don't all have that fallback. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://abhishekghume.github.io/portfolio/" />
    <meta name="twitter:title" content="Abhishek — Fresher Software Engineer" />
    <meta
      name="twitter:description"
      content="Building backend systems, automation workflows, and AI-powered applications. Based in Pune, India."
    />
    <meta name="twitter:image" content="https://abhishekghume.github.io/portfolio/og-image.png" />
    <meta name="twitter:image:alt" content="Abhishek — Fresher Software Engineer" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load non-render-blocking: the stylesheet is fetched as `print`
         (low priority, doesn't block first paint) then flipped to `all` once
         loaded. `display=swap` already avoids invisible text, so the page
         paints immediately in the system fallback and swaps to the webfonts
         when ready. <noscript> keeps it working with JS disabled. Weights are
         trimmed to those actually used (Inter dropped unused 300 & 800). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <meta name="theme-color" content="#060a13" />
    <style>

         (avoids a flash before the CSS bundle loads). */
      html {
